version: '3.8'

services:
  # 1. The Database Container
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # 2. The Backend Container
  backend:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      # This tells the backend to look for the 'mongodb' container, not localhost
      - MONGO_URI=mongodb://mongodb:27017/employeedirectory
    depends_on:
      - mongodb

  # 3. The Frontend Container (ADD THIS PART!)
  frontend:
    build: ./client
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  mongo-data: